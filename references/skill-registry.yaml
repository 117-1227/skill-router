version: "1.0"
skills:
  - name: code-review
    priority: audit
    invocation: explicit-only
    responsibility: "Review code changes against repository standards and the originating specification from a fixed Git comparison point."
    use_when:
      - "Review a branch, pull request, commit range, or work-in-progress changes."
      - "Review changes since a commit, branch, tag, or merge-base."
      - "Check whether a diff follows repository standards and implements its specification."
    exclude_when:
      - "Diagnosing a concrete failure, exception, flaky bug, or performance regression."
      - "A security-only review without a general code-review request."
      - "Reviewing an entire codebase without a fixed Git comparison point."
    follow_up_skills:
      - diagnosing-bugs
      - security-best-practices

  - name: diagnosing-bugs
    priority: diagnosis
    invocation: explicit-only
    responsibility: "Build a reproducible feedback loop, identify the root cause, and verify fixes for hard bugs and performance regressions."
    use_when:
      - "The user asks to diagnose or debug broken behavior."
      - "Code throws, fails, produces incorrect output, behaves intermittently, or has become slow."
      - "A bug or performance regression requires reproduction, minimisation, hypotheses, and instrumentation."
    exclude_when:
      - "A general branch, pull request, or diff review without a concrete failure."
      - "A security review without a reported runtime symptom."
      - "A simple, already-understood localized correction that does not require diagnosis."
    follow_up_skills:
      - code-review

  - name: security-best-practices
    priority: security
    invocation: explicit-only
    responsibility: "Provide language- and framework-specific security reviews, reports, and secure-by-default implementation guidance."
    use_when:
      - "The user explicitly requests security best practices or secure-by-default code."
      - "The user explicitly requests a security review, audit, or vulnerability report."
      - "Reviewing Python, JavaScript/TypeScript, or Go code for security risks."
    exclude_when:
      - "General code review, debugging, or feature implementation without an explicit security request."
      - "The project language is outside the skill's supported languages."
      - "The request concerns compliance or penetration testing beyond secure coding guidance."
    follow_up_skills:
      - code-review

  - name: analytics
    priority: domain
    invocation: explicit-only
    responsibility: "Analytics tracking, measurement, attribution, and marketing or product performance decisions."
    use_when:
      - "Set up, improve, or audit analytics tracking."
      - "GA4, Google Analytics, GTM, conversion tracking, event tracking, UTM, Mixpanel, or Segment."
      - "Define a tracking plan or determine how to measure whether an activity is working."
    exclude_when:
      - "Backend-only logic without measurement requirements."
      - "Pure visual design without tracking or measurement."
    follow_up_skills:
      - ui-ux-pro-max
      - web-design-guidelines

  - name: ui-ux-pro-max
    priority: foundation
    invocation: explicit-only
    responsibility: "Product structure, interaction, responsive behavior, accessibility, and stack-specific UI implementation."
    use_when:
      - "Design, review, or refactor a Web, mobile, or desktop interface."
      - "Information architecture, interaction flows, responsive layout, component systems, forms, feedback, or animation."
      - "SaaS products, dashboards, data panels, or complex product interfaces."
    exclude_when:
      - "Backend-only, database-only, infrastructure, or non-visual scripting tasks."
      - "A visual-only request with no product UI or interaction decisions."
    follow_up_skills:
      - frontend-design
      - web-design-guidelines

  - name: frontend-design
    priority: visual
    invocation: explicit-only
    responsibility: "Visual direction, brand expression, typography, color, composition, and distinctive page presentation."
    use_when:
      - "Create a new page, landing page, brand site, or marketing page."
      - "Choose visual direction, typography, color, layout, composition, or page personality."
      - "Reshape an interface to avoid generic or template-like visual results."
    exclude_when:
      - "Backend-only or non-visual work."
      - "A focused accessibility or compliance audit without visual redesign."
    follow_up_skills:
      - ui-ux-pro-max
      - web-design-guidelines

  - name: web-design-guidelines
    priority: audit
    invocation: explicit-only
    responsibility: "Web Interface Guidelines compliance, accessibility review, UX review, and pre-release Web validation."
    use_when:
      - "Review existing UI code or a Web page."
      - "Check accessibility, UX, responsive behavior, visual consistency, or Web best practices."
      - "Perform a final Web review before release."
    exclude_when:
      - "Creating a visual direction from scratch without an existing Web implementation to review."
      - "Backend-only or non-Web work."
    follow_up_skills:
      - ui-ux-pro-max

  - name: design-system
    priority: foundation
    invocation: explicit-only
    responsibility: "Design tokens, component specifications, CSS variables, and systematic design architecture."
    use_when:
      - "Create or refine design tokens."
      - "Define primitive, semantic, or component token layers."
      - "Create spacing, typography, color, or component specifications."
      - "Plan or migrate a design system."
    exclude_when:
      - "Pure visual exploration without reusable system requirements."
      - "Component implementation without token or system decisions."
    follow_up_skills:
      - ui-styling

  - name: ui-styling
    priority: implementation
    invocation: explicit-only
    responsibility: "Implement accessible UI components, themes, responsive layouts, and styling systems."
    use_when:
      - "Build UI components with Tailwind, shadcn/ui, or Radix UI."
      - "Implement dialogs, dropdowns, forms, tables, themes, or dark mode."
      - "Convert design tokens or visual specifications into frontend code."
      - "Establish consistent styling patterns across an application."
    exclude_when:
      - "Backend-only or non-visual work."
      - "Visual direction without implementation."
    follow_up_skills:
      - web-design-guidelines
